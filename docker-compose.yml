name: retail-rocket-streaming

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo ">>> Creating topic ${KAFKA_TOPIC:-retail-rocket-events} ..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-retail-rocket-events} \
          --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
          --replication-factor 1 \
          --config retention.ms=${KAFKA_TOPIC_RETENTION_MS:-604800000}
        echo ">>> Topic details:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --describe --topic ${KAFKA_TOPIC:-retail-rocket-events}
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  producer:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 25s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-retail-rocket-events}
      CSV_PATH: ${CSV_PATH:-/app/data/events_sorted.csv}
      LIMIT: ${LIMIT:-}
      SKIP: ${SKIP:-0}
      SPEEDUP: ${SPEEDUP:-20}
      MAX_SLEEP: ${MAX_SLEEP:-5}
      RATE: ${RATE:-10}
      PROGRESS_EVERY: ${PROGRESS_EVERY:-100}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15}
    volumes:
      - ./producer.py:/app/producer.py:ro
      - ./data:/app/data:ro


volumes:
  kafka-data:

